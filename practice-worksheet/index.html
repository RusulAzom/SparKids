<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Worksheet (Word Making) - SparkKids</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hind Siliguri', Arial, sans-serif;
  background: #eef4fb;
  color: #1f2937;
  padding-top: 104px;            /* cleared by JS once the fixed bar is measured */
}

/* ================= TOP ACTION BAR (screen only) ================= */
.action-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  background: #ffffff;
  border-bottom: 1px solid #dbeafe;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
}
.action-bar-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; }
.brand-badge {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #f472b6, #e11d48);
  display: grid; place-items: center;
  font-size: 20px;
}
.brand-text { font-size: 17px; font-weight: 800; line-height: 1.1; }
.brand-text small {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #E9407D;
}
.bar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar-hint { font-size: 11px; font-weight: 700; color: #64748b; }
.btn {
  font-family: 'Hind Siliguri', Arial, sans-serif;
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  padding: 10px 20px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-print {
  background: linear-gradient(135deg, #E9407D, #c81e5b);
  color: #fff;
  box-shadow: 0 8px 18px rgba(233, 64, 125, 0.35);
}
.btn-back { background: #fff; color: #3A86FF; border: 2px solid #BFDBFE; }

/* ================= A4 SHEETS ================= */
.packet {
  max-width: 210mm;
  margin: 0 auto;
  padding: 0 8px 40px;
}
.a4-page {
  position: relative;
  width: 210mm;
  height: 297mm;
  min-height: 297mm;
  padding: 10mm 12mm;
  margin: 0 auto 18px;
  background: #fff;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
  display: flex;
  flex-direction: column;
  gap: 4mm;
}

/* ---- sheet header ---- */
.sheet-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  font-weight: 700;
  color: #334155;
  padding-bottom: 6px;
  border-bottom: 2px solid #E2E8F0;
}
.sheet-title {
  margin-top: 8px;
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #E9407D;
}
.sheet-sub {
  margin-top: 2px;
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  color: #3A86FF;
}
.sheet-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  font-weight: 700;
  color: #64748b;
  border-top: 1.5px dashed #CBD5E1;
  padding-top: 5px;
}

/* ================= WORKSHEET ITEMS (2 per A4 sheet) ================= */
.items {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5mm;
}
.item {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  border: 2px dashed #90CDF4;
  border-radius: 16px;
  background: #F8FBFF;
  overflow: hidden;
}
.item-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.item-no {
  font-size: 18px;
  font-weight: 800;
  color: #3A86FF;
}
/* phonics sound & pronunciation guide banner */
.phonics-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 0 auto;
  padding: 3px 12px;
  border: 1.5px dashed #7DD3FC;
  border-radius: 999px;
  background: #F0F9FF;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;
  color: #0C4A6E;
  text-align: center;
}
.phonics-badge .ipa {
  color: #E9407D;
  font-weight: 800;
  white-space: nowrap;
}
.phonics-badge .bn-sound { color: #0369A1; }
.item-type {
  margin-left: auto;
  padding: 2px 10px;
  border: 1.5px dashed #F9A8D4;
  border-radius: 999px;
  background: #FDF2F8;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #E9407D;
}

/* ---- 3 column inner grid: letters | flower | word pills ---- */
.item-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 122px 1.35fr;
  gap: 6px 12px;
  align-items: stretch;
}
.col-left,
.col-right {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 6px;
  position: relative;
  z-index: 1;
}
.col-left { align-items: center; }
/* pills hug their content instead of stretching to the column width */
.col-right { align-items: flex-start; }
.col-center {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* left column: single letters / letter chunks */
.chunk {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  padding: 5px 12px;
  border: 1.5px solid #BFDBFE;
  border-radius: 999px;
  background: #EFF6FF;
  color: #1D4ED8;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: 0.02em;
}

/* right column: pill shaped word boxes — compact, left packed */
.pill {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 4px 14px;
  border: 2px solid #3A86FF;
  border-radius: 999px;
  background: #fff;
  color: #3A86FF;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.15;
  min-height: 34px;
}
.pill-emoji { font-size: 17px; line-height: 1; flex: 0 0 auto; }
/* highlighted root chunk / word ending (an, it, ake, tion …) */
.pill-hl {
  color: #E9407D;
  font-weight: 800;
  background: #FDF2F8;
  border-radius: 6px;
  padding: 0 2px;
  box-shadow: inset 0 -2px 0 rgba(233, 64, 125, 0.28);
}
/* subtle Bangla meaning beside the word */
.pill-bn {
  font-size: 12px;
  font-weight: 600;
  color: #64748B;
  white-space: nowrap;
}

/* ---- center flower anchor ---- */
.flower {
  position: relative;
  z-index: 1;
  width: 122px;
  height: 122px;
  display: grid;
  place-items: center;
}
.flower-center {
  position: relative;
  z-index: 2;
  width: 64px;
  height: 64px;
  border: 4px solid #fff;
  border-radius: 50%;
  background: #E9407D;
  color: #fff;
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 8px 16px rgba(233, 64, 125, 0.35);
}
.flower-center.is-long { font-size: 16px; }
.petal {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.14);
}

/* ---- dashed connector overlay ---- */
.connectors {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ================= RESPONSIVE (small screens) ================= */
/* A4 sheets keep exact print width; on narrow screens the packet
   scrolls horizontally instead of breaking the whole page layout. */
body { overflow-x: clip; }
.packet { overflow-x: auto; }
.a4-page { flex: 0 0 auto; }
@media (min-width: 821px) {
  .packet { overflow-x: visible; }
}

/* ================= PRINT ================= */
@page { size: A4 portrait; margin: 0; }

@media print {
  body { background: #fff; padding-top: 0 !important; }
  .no-print { display: none !important; }
  .packet { max-width: none; padding: 0; }
  .a4-page {
    page-break-after: always;
    break-after: page;
    width: 210mm;
    height: auto !important;      /* keeps the bottom of a sheet from being clipped */
    max-height: none !important;
    min-height: 297mm;
    overflow: visible !important;
    margin: 0 !important;
    box-shadow: none !important;
  }
  .a4-page:last-of-type { page-break-after: auto; break-after: auto; }
  .item,
  .chunk,
  .pill,
  .pill-hl,
  .phonics-badge,
  .flower-center,
  .petal,
  .item-type,
  .connectors line {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>
</head>
<body>

<!-- ================= TOP ACTION BAR (non-printable) ================= -->
<header class="action-bar no-print">
  <div class="action-bar-inner">
    <a href="../index.html" class="brand">
      <span class="brand-badge">🧩</span>
      <span class="brand-text">
        SparKids
        <small>Practice Worksheet • Word Making</small>
      </span>
    </a>
    <div class="bar-actions">
      <span class="bar-hint">১০টি ওয়ার্কশিট • ৫টি A4 পাতা</span>
      <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Print Worksheets</button>
      <a href="../index.html" class="btn btn-back">← মেইন ড্যাশবোর্ড</a>
    </div>
  </div>
</header>

<!-- ================= A4 PACKET (rendered by the script below) ================= -->
<main class="packet" id="packet"></main>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------
     Exact worksheet dataset — 10 items, 2 items per A4 sheet (5 sheets)
  --------------------------------------------------------------- */
  const worksheets = [
    {
      id: 1, center: "an", phonics: "🔊 Sound: /æ/ + /n/ = /æn/ (অ্যান)",
      left: ["m","r","p","c","f","v"],
      right: [
        { prefix: "m", chunk: "an", emoji: "👨", bn: "মানুষ" },
        { prefix: "r", chunk: "an", emoji: "🏃", bn: "দৌড়েছিল" },
        { prefix: "p", chunk: "an", emoji: "🍳", bn: "কড়াই" },
        { prefix: "c", chunk: "an", emoji: "🥫", bn: "কৌটা" },
        { prefix: "f", chunk: "an", emoji: "🪭", bn: "পাখা" }
      ]
    },
    {
      id: 2, center: "it", phonics: "🔊 Sound: /ɪ/ + /t/ = /ɪt/ (ইট)",
      left: ["b","f","h","k","s"],
      right: [
        { prefix: "b", chunk: "it", emoji: "🤏", bn: "একটু" },
        { prefix: "f", chunk: "it", emoji: "💪", bn: "ফিট/উপযুক্ত" },
        { prefix: "h", chunk: "it", emoji: "🥊", bn: "আঘাত করা" },
        { prefix: "k", chunk: "it", emoji: "🧰", bn: "সরঞ্জাম বাকশো" },
        { prefix: "s", chunk: "it", emoji: "🪑", bn: "বসা" }
      ]
    },
    {
      id: 3, center: "op", phonics: "🔊 Sound: /ɒ/ + /p/ = /ɒp/ (অপ)",
      left: ["m","t","h","p","c"],
      right: [
        { prefix: "m", chunk: "op", emoji: "🧹", bn: "ঝাড়ু" },
        { prefix: "t", chunk: "op", emoji: "🔝", bn: "লাটিম/উপরে" },
        { prefix: "h", chunk: "op", emoji: "🐰", bn: "লাফ দেওয়া" },
        { prefix: "p", chunk: "op", emoji: "🎈", bn: "পপ শব্দ" },
        { prefix: "c", chunk: "op", emoji: "👮", bn: "পুলিশ" }
      ]
    },
    {
      id: 4, center: "ug", phonics: "🔊 Sound: /ʌ/ + /ɡ/ = /ʌɡ/ (আগ)",
      left: ["b","h","m","j","r"],
      right: [
        { prefix: "b", chunk: "ug", emoji: "🐛", bn: "পোকা" },
        { prefix: "h", chunk: "ug", emoji: "🤗", bn: "জড়িয়ে ধরা" },
        { prefix: "m", chunk: "ug", emoji: "☕", bn: "মগ" },
        { prefix: "j", chunk: "ug", emoji: "🏺", bn: "জগ" },
        { prefix: "r", chunk: "ug", emoji: "🟫", bn: "পাপোশ" }
      ]
    },
    {
      id: 5, center: "ake", phonics: "🔊 Sound: /eɪk/ (এইক)",
      left: ["m","b","c","l","sh"],
      right: [
        { prefix: "m", chunk: "ake", emoji: "🛠️", bn: "তৈরি করা" },
        { prefix: "b", chunk: "ake", emoji: "🍞", bn: "বেক করা" },
        { prefix: "c", chunk: "ake", emoji: "🎂", bn: "কেক" },
        { prefix: "l", chunk: "ake", emoji: "🏞️", bn: "হ্রদ" },
        { prefix: "sh", chunk: "ake", emoji: "🥤", bn: "ঝাঁকানো/শেক" }
      ]
    },
    {
      id: 6, center: "ee", phonics: "🔊 Sound: /iː/ (দীর্ঘ ই)",
      left: ["s","tr","b","f","sh"],
      right: [
        { prefix: "s", chunk: "ee", emoji: "👀", bn: "দেখা" },
        { prefix: "tr", chunk: "ee", emoji: "🌳", bn: "গাছ" },
        { prefix: "b", chunk: "ee", emoji: "🐝", bn: "মৌমাছি" },
        { prefix: "f", chunk: "ee", emoji: "💵", bn: "ফি/ফি প্রদান" },
        { prefix: "sh", chunk: "eep", emoji: "🐑", bn: "ভেড়া" }
      ]
    },
    {
      id: 7, center: "ight", phonics: "🔊 Sound: /aɪt/ (আইট)",
      left: ["l","n","r","br","fl"],
      right: [
        { prefix: "l", chunk: "ight", emoji: "💡", bn: "আলো" },
        { prefix: "n", chunk: "ight", emoji: "🌙", bn: "রাত" },
        { prefix: "r", chunk: "ight", emoji: "✅", bn: "সঠিক" },
        { prefix: "br", chunk: "ight", emoji: "✨", bn: "উজ্জ্বল" },
        { prefix: "fl", chunk: "ight", emoji: "✈️", bn: "উড্ডয়ন" }
      ]
    },
    {
      id: 8, center: "ing", phonics: "🔊 Suffix Sound: /ɪŋ/ (ইং)",
      left: ["play","go","read","jump","sing"],
      right: [
        { prefix: "play", chunk: "ing", emoji: "🎮", bn: "খেলছে" },
        { prefix: "go", chunk: "ing", emoji: "🚶", bn: "যাচ্ছে" },
        { prefix: "read", chunk: "ing", emoji: "📚", bn: "পড়ছে" },
        { prefix: "jump", chunk: "ing", emoji: "🤾", bn: "লাফাচ্ছে" },
        { prefix: "sing", chunk: "ing", emoji: "🎤", bn: "গান গাইছে" }
      ]
    },
    {
      id: 9, center: "ly", phonics: "🔊 Suffix Sound: /li/ (লি)",
      left: ["quick","slow","kind","happy","sad"],
      right: [
        { prefix: "quick", chunk: "ly", emoji: "⚡", bn: "দ্রুতভাবে" },
        { prefix: "slow", chunk: "ly", emoji: "🐢", bn: "ধীরে ধীরে" },
        { prefix: "kind", chunk: "ly", emoji: "🙏", bn: "দয়ার সাথে" },
        { prefix: "happy", chunk: "ly", emoji: "😊", bn: "আনন্দের সাথে" },
        { prefix: "sad", chunk: "ly", emoji: "😢", bn: "দুঃখের সাথে" }
      ]
    },
    {
      id: 10, center: "tion", phonics: "🔊 Suffix Sound: /ʃən/ (শান)",
      left: ["ac","na","sta","va-ca","atten"],
      right: [
        { prefix: "ac", chunk: "tion", emoji: "🎬", bn: "কাজ/অ্যাকশন" },
        { prefix: "na", chunk: "tion", emoji: "🌍", bn: "জাতি" },
        { prefix: "sta", chunk: "tion", emoji: "🚉", bn: "স্টেশন" },
        { prefix: "va-ca", chunk: "tion", emoji: "🏖️", bn: "ছুটি" },
        { prefix: "atten", chunk: "tion", emoji: "❗", bn: "মনোযোগ" }
      ]
    }
  ];

  var ITEMS_PER_SHEET = 2;                                            /* exactly 2 cards per A4 sheet */
  var SHEET_COUNT = Math.ceil(worksheets.length / ITEMS_PER_SHEET);   /* -> 5 sheets */

  /* Six petals around the flower centre: yellow, green, blue, purple, red, orange */
  var PETALS = [
    { x: 0,   y: -47, color: '#FACC15' },   /* yellow */
    { x: 41,  y: -24, color: '#22C55E' },   /* green  */
    { x: 41,  y: 24,  color: '#3B82F6' },   /* blue   */
    { x: 0,   y: 47,  color: '#A855F7' },   /* purple */
    { x: -41, y: 24,  color: '#EF4444' },   /* red    */
    { x: -41, y: -24, color: '#F97316' }    /* orange */
  ];

  function pad2(value) { return String(value).padStart(2, '0'); }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /* ---------------- templates ---------------- */
  function flowerHtml(center) {
    var petals = PETALS.map(function (petal) {
      return '<span class="petal" style="background:' + petal.color + ';transform:translate(' +
        petal.x + 'px,' + petal.y + 'px)"></span>';
    }).join('');
    var isLong = center.replace(/-/g, '').length > 2 ? ' is-long' : '';
    return '<div class="flower">' + petals +
      '<span class="flower-center' + isLong + '">' + esc(center) + '</span></div>';
  }

  /* Phonics guide: "🔊 Sound: /æ/ + /n/ = /æn/ (অ্যান)"
     Every /.../ IPA segment in accent pink, the trailing (Bangla) in blue. */
  function phonicsHtml(phonics) {
    if (!phonics) { return ''; }
    var text = esc(phonics);
    var body = text
      .replace(/\/([^/]+)\//g, function (_, ipa) {
        return '<span class="ipa">/' + ipa + '/</span>';
      })
      .replace(/（([^）]*)）/g, '（<span class="bn-sound">$1</span>）')
      .replace(/\(([^)]*)\)\s*$/, '(<span class="bn-sound">$1</span>)');
    return '<span class="phonics-badge">' + body + '</span>';
  }

  function itemHtml(item) {
    var left = item.left.map(function (chunk) {
      return '<span class="chunk">' + esc(chunk) + '</span>';
    }).join('');

    var right = item.right.map(function (entry) {
      return '<span class="pill">' +
          '<span class="pill-word">' + esc(entry.prefix) +
            '<span class="pill-hl">' + esc(entry.chunk) + '</span></span>' +
          '<span class="pill-emoji">' + esc(entry.emoji) + '</span>' +
          '<span class="pill-bn">(' + esc(entry.bn) + ')</span>' +
        '</span>';
    }).join('');

    return '<article class="item" data-item="' + item.id + '">' +
        '<div class="item-head">' +
          '<span class="item-no">' + item.id + '.</span>' +
          phonicsHtml(item.phonics) +
        '</div>' +
        '<div class="item-grid">' +
          '<div class="col-left">' + left + '</div>' +
          '<div class="col-center">' + flowerHtml(item.center) + '</div>' +
          '<div class="col-right">' + right + '</div>' +
        '</div>' +
        '<svg class="connectors" aria-hidden="true" preserveAspectRatio="none"></svg>' +
      '</article>';
  }

  function sheetHtml(group, sheetNo) {
    return '<section class="a4-page" data-sheet="' + sheetNo + '">' +
        '<header class="sheet-head">' +
          '<div class="sheet-meta">' +
            '<span>Name: ____________________</span>' +
            '<span>Date: ___________</span>' +
            '<span>Page: ' + pad2(sheetNo) + '</span>' +
          '</div>' +
          '<h1 class="sheet-title">PRACTICE WORKSHEET</h1>' +
          '<p class="sheet-sub">Make new words by joining letters</p>' +
        '</header>' +
        '<div class="items">' + group.map(itemHtml).join('') + '</div>' +
        '<footer class="sheet-foot">' +
          '<span>SparkKids | Spar Publication</span>' +
          '<span>Practice Worksheet (Word Making) — Page ' + pad2(sheetNo) + ' of ' + pad2(SHEET_COUNT) + '</span>' +
        '</footer>' +
      '</section>';
  }

  /* ---------------- render: 2 items per A4 sheet ---------------- */
  var packet = document.getElementById('packet');
  var sheets = [];
  for (var s = 0; s < worksheets.length; s += ITEMS_PER_SHEET) {
    sheets.push(worksheets.slice(s, s + ITEMS_PER_SHEET));
  }
  packet.innerHTML = sheets.map(function (group, index) {
    return sheetHtml(group, index + 1);
  }).join('');

  /* ---------------- dashed connectors: letters -> flower -> word pills ---------------- */
  function segments(from, to, startGap, endGap) {
    var dx = to.x - from.x;
    var dy = to.y - from.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len;
    var uy = dy / len;
    return {
      x1: from.x + ux * startGap,
      y1: from.y + uy * startGap,
      x2: to.x - ux * endGap,
      y2: to.y - uy * endGap
    };
  }

  function round1(value) { return Math.round(value * 10) / 10; }

  function drawConnectors() {
    var items = document.querySelectorAll('.item');

    Array.prototype.forEach.call(items, function (item) {
      var svg = item.querySelector('.connectors');
      var flowerEl = item.querySelector('.flower-center');
      if (!svg || !flowerEl) { return; }

      var box = svg.getBoundingClientRect();
      if (!box.width || !box.height) { return; }

      var flowerRect = flowerEl.getBoundingClientRect();
      var flower = {
        x: flowerRect.left - box.left + flowerRect.width / 2,
        y: flowerRect.top - box.top + flowerRect.height / 2
      };
      var radius = flowerRect.width / 2 + 2;
      var paths = [];

      /* every left letter / chunk joins the flower centre */
      Array.prototype.forEach.call(item.querySelectorAll('.chunk'), function (chunk) {
        var rect = chunk.getBoundingClientRect();
        paths.push(segments({
          x: rect.right - box.left,
          y: rect.top - box.top + rect.height / 2
        }, flower, 2, radius));
      });

      /* the flower centre joins every right word pill */
      Array.prototype.forEach.call(item.querySelectorAll('.pill'), function (pill) {
        var rect = pill.getBoundingClientRect();
        paths.push(segments(flower, {
          x: rect.left - box.left,
          y: rect.top - box.top + rect.height / 2
        }, radius, 2));
      });

      svg.setAttribute('viewBox', '0 0 ' + round1(box.width) + ' ' + round1(box.height));
      svg.innerHTML = paths.map(function (path) {
        return '<line x1="' + round1(path.x1) + '" y1="' + round1(path.y1) +
          '" x2="' + round1(path.x2) + '" y2="' + round1(path.y2) +
          '" stroke="#90CDF4" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"></line>';
      }).join('');
    });
  }

  /* ---------------- keep the fixed action bar from covering the first sheet ---------------- */
  function syncBarSpacing() {
    var bar = document.querySelector('.action-bar');
    if (!bar) { return; }
    document.body.style.paddingTop = (bar.offsetHeight + 18) + 'px';
  }

  function refresh() {
    drawConnectors();
    syncBarSpacing();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(refresh, 150);
  });
  window.addEventListener('beforeprint', drawConnectors);
  window.addEventListener('load', refresh);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(refresh);
  }
  refresh();
})();
</script>

</body>
</html>
